<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b4a58">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Comercios">
<meta name="description" content="Directorio de comercios de Colonia del Sacramento para usar desde el inicio del celular.">
<title>Comercios Colonia</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f1ea;--fg:#1a1d21;--mut:#6b7280;--card:#fff;--line:#e4e0d6;
  --ac:#1b4a58;--on:#fff;--ok:#188038;--ok-fg:#fff;--danger:#b42318;
  --chip:#ece9e1;--rej-bg:#fef2f2;--rej-bd:#f0b4b0;--toast:#1b4a58;
}
html.dark{
  --bg:#14181a;--fg:#eceef1;--mut:#9aa1ab;--card:#1e2428;--line:#2c3338;
  --ac:#7eb0bc;--on:#0b1220;--ok:#6fd08a;--ok-fg:#0b1220;--danger:#f0a0a0;
  --chip:#2a3136;--rej-bg:#2b1517;--rej-bd:#7f2a2a;--toast:#1b4a58;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.35}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 12px}
.inner{max-width:36rem;margin:0 auto}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
h1{font-size:1.55rem;font-weight:600;letter-spacing:-.03em;margin:0;line-height:1.1}
.sub{color:var(--mut);font-size:.85rem;margin:.3rem 0 0}
.iconbtns{display:flex;gap:8px}
.iconbtn{width:40px;height:40px;border:1px solid var(--line);background:var(--card);color:var(--fg);
  border-radius:12px;display:grid;place-items:center;cursor:pointer;padding:0}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#count{color:var(--mut);font-size:.85rem;font-variant-numeric:tabular-nums;margin:10px 0 0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--chip);border-radius:16px;padding:4px;margin-top:12px}
.seg button{border:0;background:none;color:var(--mut);font:inherit;font-weight:600;padding:10px;border-radius:12px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.search{position:relative;margin-top:12px}
.search input{width:100%;height:48px;border:1px solid var(--line);background:var(--card);color:var(--fg);
  border-radius:16px;padding:0 44px 0 42px;font:inherit;font-size:1rem}
.search input:focus{outline:2px solid var(--ac);outline-offset:1px}
.search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none}
.search .ico svg{display:block;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
#qClear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;
  background:none;color:var(--mut);border-radius:99px;cursor:pointer;font-size:18px}
main{max-width:36rem;margin:0 auto;padding:12px 16px calc(32px + env(safe-area-inset-bottom,0px))}
.install{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:14px;margin-bottom:12px}
.install h2{font-size:1rem;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.install p{margin:0;color:var(--mut);font-size:.85rem}
.install .row{display:grid;gap:8px;margin-top:12px}
.install .row.two{grid-template-columns:1fr 1fr}
.install ol{margin:10px 0 0;padding-left:1.2rem;color:var(--mut);font-size:.85rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--chip);color:var(--fg);border-radius:999px;padding:8px 14px;font:inherit;font-size:.85rem;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ac);color:var(--on)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.note{color:var(--mut);font-size:.85rem;margin:0 0 10px}
.zh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:16px 2px 6px;font-size:1.15rem;font-weight:600;letter-spacing:-.02em}
.zh small{color:var(--mut);font-weight:500;font-size:.85rem}
.item{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:12px;margin-top:8px}
.item.rej{background:var(--rej-bg);border-color:var(--rej-bd)}
.item .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.item h3{margin:0;font-size:1rem;font-weight:650;line-height:1.3}
.tag{color:var(--danger);font-size:.75rem;font-weight:600;flex-shrink:0}
.rub{color:var(--mut);font-size:.85rem;margin:4px 0 0}
.url{color:var(--mut);font-size:.72rem;margin:8px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.grid.three{grid-template-columns:1fr 1fr 1fr}
.btn,a.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 10px;
  border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);
  font:inherit;font-size:.88rem;font-weight:600;text-decoration:none;cursor:pointer;text-align:center}
a.btn.ac,button.ac{background:var(--ac);color:var(--on);border-color:transparent}
a.btn.ok,button.ok{background:var(--ok);color:var(--ok-fg);border-color:transparent}
button.danger{color:var(--danger)}
button.danger.on{background:var(--danger);color:#fff;border-color:transparent}
.sv{display:flex;gap:8px;margin-top:12px}
.sv input{flex:1;min-width:0;height:44px;border:1px solid var(--line);background:var(--bg);color:var(--fg);
  border-radius:12px;padding:0 12px;font:inherit;font-size:.9rem}
.linktxt{color:var(--mut);font-size:.75rem;margin:10px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.textbtn{border:0;background:none;color:var(--danger);font:inherit;font-size:.85rem;font-weight:600;padding:8px 0 0;cursor:pointer}
.empty{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:36px 16px;text-align:center;margin-top:8px}
.empty p{margin:0}
.empty .m{color:var(--mut);font-size:.85rem;margin-top:6px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--toast);color:#fff;border-radius:999px;padding:8px 16px;font-size:.85rem;font-weight:600;
  z-index:40;box-shadow:0 4px 16px rgba(0,0,0,.2)}
dialog{border:0;border-radius:24px;padding:16px;width:min(94vw,36rem);background:var(--card);color:var(--fg);
  margin:auto auto 12px;max-width:36rem}
dialog::backdrop{background:rgba(20,20,20,.45)}
dialog h2{margin:0;font-size:1.2rem}
dialog .who{color:var(--mut);font-size:.85rem;margin:4px 0 0}
dialog label{display:block;font-size:.85rem;font-weight:600;margin:14px 0 6px}
dialog textarea{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);background:var(--bg);
  color:var(--fg);border-radius:16px;padding:10px 12px;font:inherit;font-size:.9rem}
.err{color:var(--danger);font-size:.85rem;margin:8px 0 0}
#sentinel{height:24px}
input[type=search]::-webkit-search-cancel-button,input[type=search]::-webkit-search-decoration{-webkit-appearance:none;appearance:none}
html.dark #iconMoon,html:not(.dark) #iconSun{display:none!important}html.dark #iconSun,html:not(.dark) #iconMoon{display:block!important}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <div class="inner">
    <div class="top">
      <div>
        <h1>Comercios</h1>
        <p class="sub">Colonia del Sacramento</p>
      </div>
      <div class="iconbtns">
        <button type="button" class="iconbtn" id="themeBtn" aria-label="Tema oscuro">
          <svg id="iconMoon" viewBox="0 0 24 24"><path d="M21 14.3A8.5 8.5 0 1 1 9.7 3 7 7 0 0 0 21 14.3z"/></svg>
          <svg id="iconSun" viewBox="0 0 24 24" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button type="button" class="iconbtn" id="installBtn" aria-label="Instalar en el celular">
          <svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
        </button>
      </div>
    </div>
    <p id="count"></p>
    <div class="seg" role="tablist">
      <button type="button" role="tab" id="tabReviews" class="on" aria-selected="true">Reseñas</button>
      <button type="button" role="tab" id="tabSocial" aria-selected="false">Redes</button>
    </div>
    <form class="search" id="searchForm" action="#">
      <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg></span>
      <input id="q" type="search" placeholder="Buscar por nombre o rubro" aria-label="Buscar por nombre o rubro" autocomplete="off" enterkeyhint="search" autocapitalize="none">
      <button type="button" id="qClear" hidden aria-label="Borrar búsqueda">×</button>
    </form>
  </div>
</header>
<main>
  <section class="install" id="installCard" hidden>
    <h2>Instalar en el inicio</h2>
    <p>Queda el ícono en el celular y se abre directo, sin entrar al navegador ni buscar la página.</p>
    <div class="row two" id="installActions">
      <button type="button" class="btn ac" id="installNative" hidden>Instalar ahora</button>
      <button type="button" class="btn" id="installToggle">Ver cómo</button>
      <button type="button" class="btn" id="installDismiss">Ahora no</button>
    </div>
    <div id="installSteps" hidden></div>
  </section>
  <div class="chips" id="chips"></div>
  <div class="filters">
    <button type="button" class="chip" id="hideRej">Ocultar rechazados</button>
    <button type="button" class="chip" id="onlySaved" hidden>Solo con link</button>
  </div>
  <p class="note" id="note"></p>
  <div id="list"></div>
  <div id="sentinel" hidden aria-hidden="true"></div>
</main>
<dialog id="editDlg" aria-labelledby="editTitle">
  <div class="top">
    <div>
      <h2 id="editTitle">Link de reseña</h2>
      <p class="who" id="editWho"></p>
    </div>
    <button type="button" class="iconbtn" id="editClose" aria-label="Cerrar">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <label for="editUrl">URL de Google</label>
  <textarea id="editUrl" rows="4"></textarea>
  <p class="err" id="editErr" hidden></p>
  <div class="grid" style="margin-top:14px">
    <button type="button" class="btn" id="editOrig">Original</button>
    <button type="button" class="btn ac" id="editSave">Guardar</button>
  </div>
</dialog>
<div id="toast" hidden role="status"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
