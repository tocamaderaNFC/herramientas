<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de Medios de Pago</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.hue{-webkit-appearance:none;appearance:none;height:12px;border-radius:9999px;outline:none;background:linear-gradient(to right,hsl(0,86%,50%),hsl(60,86%,50%),hsl(120,86%,50%),hsl(180,86%,50%),hsl(240,86%,50%),hsl(300,86%,50%),hsl(360,86%,50%))}
.hue::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid #1d1d1f}
.hue::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid #1d1d1f}
html,body{height:100%}body{height:100dvh;overflow:hidden}
</style>
</head>
<body class="bg-gray-100 flex flex-row">
<aside class="w-1/2 md:w-96 md:flex-none bg-white shadow-2xl flex flex-col h-full border-r border-gray-200 min-w-0">
  <div class="p-3 md:p-5 border-b border-gray-100">
    <h1 class="text-base md:text-xl font-bold text-gray-800">Admin Medios de Pago</h1>
    <p class="text-sm text-gray-500 mt-1">Cargá todos los medios y exportá una sola página para el cliente.</p>
  </div>
  <div class="flex-1 overflow-y-auto p-3 md:p-5 space-y-5">
    <div>
      <label class="block text-sm font-semibold text-gray-700 mb-2">Titular (nombre y apellido)</label>
      <input id="inName" value="JUAN PÉREZ" class="w-full px-4 py-3 rounded-lg border border-gray-300 uppercase text-sm">
    </div>
    <div>
      <label class="block text-sm font-semibold text-gray-700 mb-2">Logo del negocio</label>
      <div class="flex items-center gap-3">
        <div id="bizPrev" class="w-24 h-16 bg-white border rounded-lg flex items-center justify-center p-1 shrink-0"><span class="text-xs text-gray-400">sin logo</span></div>
        <div class="flex flex-col gap-2 text-sm">
          <label class="text-blue-600 underline cursor-pointer">Subir logo<input id="inBiz" type="file" accept="image/*" class="sr-only"></label>
          <button id="bizDel" type="button" class="text-red-600 text-left" hidden>Quitar logo</button>
        </div>
      </div>
    </div>
    <div>
      <div class="text-sm font-semibold text-gray-700 mb-2">Agregar medio de pago</div>
      <div id="presets" class="flex flex-wrap gap-2"></div>
    </div>
    <div id="list" class="space-y-4"></div>
  </div>
  <div class="p-3 md:p-4 bg-gray-50 border-t border-gray-200">
    <button id="btnExport" class="w-full bg-gray-900 active:bg-black text-white font-bold py-3.5 rounded-xl shadow-lg">Exportar página del cliente</button>
  </div>
</aside>
<main id="pv" class="flex-1 min-w-0 bg-gray-200 h-full overflow-hidden relative">
  <iframe id="frame" style="width:390px;height:844px;border:0;background:#fff;position:absolute;top:0;left:0;transform-origin:0 0"></iframe>
</main>

let uid = 1;
const state = { name:'JUAN PÉREZ', bizLogo:'', methods:[] };
const $ = id => document.getElementById(id);

function addMethod(key){
  const p = PRESETS.find(x=>x.key===key);
  state.methods.push({id:uid++, key, label:p.label, fields:p.kinds.map(k=>({kind:k,value:''})), hue:p.hue, logo:LOGOS[key]||''});
  renderList(); preview();
}

function renderList(){
  const box = $('list'); box.innerHTML='';
  if(!state.methods.length){ box.innerHTML='<p class="text-sm text-gray-400 text-center py-4">Todavía no agregaste ningún medio.</p>'; return; }
  state.methods.forEach((m,i)=>{
    const d = document.createElement('div');
    d.className='border border-gray-200 rounded-xl p-4 space-y-3 bg-gray-50';
    d.innerHTML = `
      <div class="flex items-center gap-3">
        <div class="w-20 h-10 bg-white border rounded-lg flex items-center justify-center p-1 shrink-0">
          ${m.logo?`<img src="${m.logo}" class="max-h-full max-w-full object-contain">`:'<span class="text-xs text-gray-400">sin logo</span>'}
        </div>
        <input data-f="label" value="${esc(m.label)}" class="flex-1 min-w-0 px-3 py-2 rounded-lg border border-gray-300 text-sm font-semibold" placeholder="Nombre del medio">
      </div>
      ${m.fields.map((f,j)=>`<div class="space-y-1 border-l-2 border-gray-300 pl-2">
        <div class="flex gap-1"><input data-fk="${j}" value="${esc(f.kind)}" class="flex-1 min-w-0 px-2 py-1 rounded border border-gray-300 text-xs font-semibold text-gray-600" placeholder="Tipo (CVU, Alias…)">${m.fields.length>1?`<button data-fd="${j}" class="text-red-600 px-2">×</button>`:''}</div>
        <input data-fv="${j}" value="${esc(f.value)}" class="w-full px-3 py-2 rounded-lg border border-gray-300 text-sm font-mono" placeholder="Número / alias / clave"></div>`).join('')}
      <button data-add class="text-xs text-blue-600 underline">+ Agregar otro dato</button>
      <div class="flex items-center gap-3">
        <input data-f="hue" type="range" min="0" max="360" value="${m.hue}" class="hue flex-1">
        <span class="w-5 h-5 rounded-full border" style="background:hsl(${m.hue},86%,50%)"></span>
      </div>
      <div class="flex items-center justify-between text-xs">
        <label class="text-blue-600 underline cursor-pointer">Cambiar logo<input type="file" accept="image/*" class="sr-only" data-f="logo"></label>
        <div class="flex gap-3 text-gray-500">
          <button data-a="up" ${i==0?'disabled class="opacity-30"':''}>↑ Subir</button>
          <button data-a="down" ${i==state.methods.length-1?'disabled class="opacity-30"':''}>↓ Bajar</button>
          <button data-a="del" class="text-red-600">Eliminar</button>
        </div>
      </div>`;
    d.querySelectorAll('[data-f]').forEach(el=>{
      const f = el.dataset.f;
      if(f==='logo'){
        el.onchange = e=>{ const file=e.target.files[0]; if(!file) return;
          loadLogo(file,300,url=>{ m.logo=url; renderList(); preview(); }); };
      } else {
        el.oninput = e=>{ m[f] = f==='hue'?parseInt(e.target.value,10):e.target.value;
          if(f==='hue') el.nextElementSibling.style.background=`hsl(${m.hue},86%,50%)`;
          preview(); };
      }
    });
    d.querySelectorAll('[data-fk]').forEach(el=>el.oninput=e=>{ m.fields[+el.dataset.fk].kind=e.target.value; preview(); });
    d.querySelectorAll('[data-fv]').forEach(el=>el.oninput=e=>{ m.fields[+el.dataset.fv].value=e.target.value; preview(); });
    d.querySelectorAll('[data-fd]').forEach(el=>el.onclick=()=>{ m.fields.splice(+el.dataset.fd,1); renderList(); preview(); });
    d.querySelector('[data-add]').onclick=()=>{ m.fields.push({kind:'Alias',value:''}); renderList(); preview(); };
    d.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
      const a=b.dataset.a;
      if(a==='del') state.methods.splice(i,1);
      else { const j=a==='up'?i-1:i+1; [state.methods[i],state.methods[j]]=[state.methods[j],state.methods[i]]; }
      renderList(); preview();
    });
    box.appendChild(d);
  });
}
// Lee una imagen y la reduce (máx. `max` px) para que el HTML final pese poco (QR / NFC)
function loadLogo(file,max,cb){
  const r=new FileReader();
  r.onload=ev=>{
    const raw=ev.target.result;
    if(file.type==='image/svg+xml'){ cb(raw); return; }
    const img=new Image();
    img.onload=()=>{
      const k=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*k)); c.height=Math.max(1,Math.round(img.height*k));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL('image/png'));
    };
    img.onerror=()=>cb(raw);
    img.src=raw;
  };
  r.readAsDataURL(file);
}

  <div class="titular" id="titular"></div>
  <div id="list"><div class="sub">Elegí tu medio de pago</div><div id="tiles"></div></div>
  <div id="detail" hidden>
    <button class="back" id="back">← Otros medios</button>
    <div class="logo"><img id="dLogo" alt=""></div>
    <div id="fields"></div>
    <div class="pasos"><h3>Cómo pagar</h3>
      <div class="paso"><div class="n">1</div><div>Tocá el botón de copiar del dato que necesites.</div></div>
      <div class="paso"><div class="n">2</div><div>Abrí tu app y elegí transferir / nueva transferencia.</div></div>
      <div class="paso"><div class="n">3</div><div>Pegá el dato, verificá el destinatario y completá el pago.</div></div>
    </div>
    <p class="nota">Verificá que el nombre del destinatario coincida con el de arriba. Si no coincide, el banco puede rechazar la operación.</p>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const D = ${data};
const $ = id => document.getElementById(id);
const ms = D.methods;
$('titular').textContent = D.name || 'NOMBRE APELLIDO';
if(D.bizLogo){ $('bizImg').src=D.bizLogo; $('biz').hidden=false; }
function toast(t){ const e=$('toast'); e.textContent=t; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'),2500); }
function fb(t,ok){ const a=document.createElement('textarea'); a.value=t; a.style.cssText='position:fixed;top:0;left:0'; document.body.appendChild(a); a.focus(); a.select();
  try{ document.execCommand('copy')?ok():toast('No se pudo copiar. Seleccionalo a mano.'); }catch(e){ toast('No se pudo copiar. Seleccionalo a mano.'); } document.body.removeChild(a); }
function copy(text,box,btn,lbl){
  if(!text){ toast('Sin dato cargado'); return; }
  const ok=()=>{ btn.textContent='¡Copiado!'; btn.classList.add('ok'); box.classList.add('copied'); toast('¡Copiado con éxito!');
    setTimeout(()=>{ btn.textContent=lbl; btn.classList.remove('ok'); box.classList.remove('copied'); },2500); };
  if(!navigator.clipboard) return fb(text,ok);
  navigator.clipboard.writeText(text).then(ok).catch(()=>fb(text,ok));
}
function show(m,canBack){
  $('list').hidden=true; $('detail').hidden=false; $('back').hidden=!canBack;
  $('dLogo').src=m.logo; $('dLogo').parentNode.hidden=!m.logo;
  const wrap=$('fields'); wrap.innerHTML=''; const h=m.hue, multi=m.fields.length>1;
  m.fields.forEach(f=>{
    const g=document.createElement('div'); g.className='fld';
    const l=document.createElement('div'); l.className='label'; l.textContent=f.kind||'Dato de pago';
    const b=document.createElement('div'); b.className='box'; b.textContent=f.value||'—';
    const bt=document.createElement('button'); bt.className='btn';
    const lbl=multi?'Copiar '+(f.kind||'dato'):'Copiar este dato';
    bt.textContent=lbl; bt.style.background='hsl('+h+',86%,50%)'; bt.style.boxShadow='0 4px 14px hsla('+h+',86%,50%,.3)';
    bt.onclick=()=>copy(f.value,b,bt,lbl);
    g.append(l,b,bt); wrap.appendChild(g);
  });
  document.querySelectorAll('.n').forEach(n=>n.style.background='hsl('+h+',86%,50%)');
  window.scrollTo(0,0);
}
ms.forEach(m=>{
  const b=document.createElement('button'); b.className='tile';
  b.innerHTML='<div class="lg">'+(m.logo?'<img src="'+m.logo+'" alt="">':'')+'</div><div class="nm"></div><div class="ch">›</div>';
  b.querySelector('.nm').textContent=m.label;
  b.onclick=()=>show(m,true); $('tiles').appendChild(b);
});
$('back').onclick=()=>{ $('detail').hidden=true; $('list').hidden=false; };
if(ms.length===1) show(ms[0],false);
if(!ms.length) $('tiles').textContent='No hay medios de pago cargados.';
<\/script>
</body></html>`;
}

function fit(){
  const pv=$('pv'), f=$('frame'), w=pv.clientWidth, h=pv.clientHeight;
  const k=Math.min(1,w/390);
  f.style.height=(h/k)+'px';
  f.style.transform='scale('+k+')';
  f.style.left=Math.max(0,(w-390*k)/2)+'px';
}
addEventListener('resize',fit);
function preview(){ $('frame').srcdoc = buildClient(); }

$('inBiz').onchange = e=>{ const f=e.target.files[0]; if(!f) return;
  loadLogo(f,480,url=>{ state.bizLogo=url; renderBiz(); preview(); }); e.target.value=''; };
$('bizDel').onclick = ()=>{ state.bizLogo=''; renderBiz(); preview(); };
$('inName').oninput = e=>{ state.name=e.target.value.toUpperCase(); preview(); };
$('btnExport').onclick = ()=>{
  const blob=new Blob([buildClient()],{type:'text/html'}), url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download='medios-de-pago.html'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
};

PRESETS.forEach(p=>{
  const b=document.createElement('button');
  b.className='px-3 py-2 rounded-full border border-gray-300 text-sm font-medium bg-white active:bg-gray-100';
  b.textContent='+ '+p.label; b.onclick=()=>addMethod(p.key); $('presets').appendChild(b);
});
['scotia','prex','mp'].forEach(addMethod);
fit();
</script>
</body>
</html>
